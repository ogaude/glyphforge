name: docker-tests

on:
  workflow_call:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk for the texlive image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run glyphforge doctor --pull
      - run: uv run pytest -m docker -q
      - name: Pillow 13 canary (allowed failure)
        if: github.event_name != 'push'
        continue-on-error: true
        run: uv pip install "pillow>=13,<14"
      - name: Pillow 13 parity (allowed failure)
        if: github.event_name != 'push'
        continue-on-error: true
        run: uv run --no-sync pytest -m "" tests/unit/test_pixels.py tests/unit/test_raster.py tests/unit/test_export_parquet.py tests/parity -q
